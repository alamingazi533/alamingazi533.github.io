<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #fff;
  }
  .container {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #fff;
    color: #203a43;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: bold;
    margin: 0 auto 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 22px;
    margin-bottom: 6px;
  }
  p.subtitle {
    font-size: 14px;
    color: #cfd8dc;
    margin-bottom: 32px;
  }
  .card {
    display: block;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
    text-decoration: none;
    color: #fff;
    text-align: left;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .card:active {
    transform: scale(0.97);
    background: rgba(255,255,255,0.15);
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-desc {
    font-size: 13px;
    color: #cfd8dc;
  }
  .emoji {
    font-size: 20px;
  }
  footer {
    margin-top: 32px;
    font-size: 12px;
    color: #90a4ae;
  }
  footer a {
    color: #80cbc4;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="avatar">AG</div>
    <h1>আলামিন গাজী</h1>
    <p class="subtitle">আমার প্রজেক্টসমূহে স্বাগতম</p>

    <a class="card" href="https://alamingazi533.github.io/registration-form/">
      <div class="card-title"><span class="emoji">📘</span> ফেসবুক সমস্যা সমাধান সেবা</div>
      <div class="card-desc">অ্যাকাউন্ট রিকভারি, ডিজেবল, মনিটাইজেশন সমস্যার জন্য রেজিস্ট্রেশন ফর্ম</div>
    </a>

    <a class="card" href="https://alamingazi533.github.io/myadda/">
      <div class="card-title"><span class="emoji">💬</span> MyAdda</div>
      <div class="card-desc">একটি নতুন সোশ্যাল মিডিয়া ওয়েব অ্যাপ — যুক্ত থাকুন, শেয়ার করুন</div>
    </a>

    <footer>
      যোগাযোগ: <a href="https://wa.me/8801764324313" target="_blank">WhatsApp</a>

  </div>
</body>
