<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>পেজ পাওয়া যায়নি</title>
<script>
// আগের /fb-help/ লিংক (যেমন /fb-help/?post=... বা /fb-help/?form=1) এখন মূল সাইটে পাঠিয়ে দেওয়া হয়,
// প্যারামিটার ও # অংশ অক্ষত রেখে। বাকি সব ভুল ঠিকানায় হোমপেজে পাঠানো হয়।
(function(){
  var p = location.pathname;
  if(p === '/fb-help' || p.indexOf('/fb-help/') === 0){
    location.replace('/' + location.search + location.hash);
  }
})();
</script>
<style>body{font-family:sans-serif;text-align:center;padding:60px 16px;background:#16201a;color:#e8efe9}a{color:#7fd1a0}</style>
</head>
<body>
<h2>পেজটি পাওয়া যায়নি</h2>
<p><a href="/">হোমপেজে যান</a></p>
</body>
</html>
